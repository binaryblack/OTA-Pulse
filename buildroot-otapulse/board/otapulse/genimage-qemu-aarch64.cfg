# OTA-Pulse A/B Partition Layout for QEMU AArch64
#
# GPT disk image with pre-allocated A/B partitions:
#   p1: boot   (FAT32, 64MB)  — kernel Image (direct boot)
#   p2: rootfs_a (ext4, 512MB) — primary rootfs
#   p3: rootfs_b (ext4, 512MB) — OTA update target (empty)
#   p4: data     (ext4, 256MB) — persistent OTA state & config
#
# QEMU launch: root=/dev/vda2 (virtio → vda, partition 2 = rootfs_a)

image boot.vfat {
    vfat {
        files = {
            "Image"
        }
    }
    size = 64M
}

image sdcard-ab-qemu.img {
    hdimage {
        gpt = true
    }

    partition boot {
        partition-type-uuid = C12A7328-F81F-11D2-BA4B-00A0C93EC93B
        image = "boot.vfat"
        size = 64M
    }

    partition rootfs_a {
        partition-type-uuid = 69DAD710-2CE4-4E3C-B16C-21A1D49ABED3
        image = "rootfs.ext4"
        size = 512M
    }

    partition rootfs_b {
        partition-type-uuid = 69DAD710-2CE4-4E3C-B16C-21A1D49ABED3
        size = 512M
    }

    partition data {
        partition-type-uuid = 0FC63DAF-8483-4772-8E79-3D69D8477DE4
        size = 256M
    }
}
