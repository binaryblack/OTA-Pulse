# OTA-Pulse A/B Partition Layout for Raspberry Pi
#
# This genimage configuration is optimized for Raspberry Pi 3/4/5.
# Uses the standard RPi boot partition layout.
#
# Partition layout:
#   - Boot partition (FAT32, firmware + kernel + DTB + config.txt)
#   - Root A partition (ext4, primary rootfs)
#   - Root B partition (ext4, OTA update target)
#   - Data partition (ext4, persistent storage)
#

image boot.vfat {
    vfat {
        files = {
            "bcm2711-rpi-4-b.dtb",
            "bcm2712-rpi-5-b.dtb",
            "rpi-firmware/bootcode.bin",
            "rpi-firmware/cmdline.txt",
            "rpi-firmware/config.txt",
            "rpi-firmware/fixup4.dat",
            "rpi-firmware/fixup4cd.dat",
            "rpi-firmware/fixup4db.dat",
            "rpi-firmware/fixup4x.dat",
            "rpi-firmware/start4.elf",
            "rpi-firmware/start4cd.elf",
            "rpi-firmware/start4db.elf",
            "rpi-firmware/start4x.elf",
            "overlays",
            "Image"
        }
    }
    size = 128M
}

image rootfs.ext4 {
    ext4 {
        label = "rootfs_a"
        use-mke2fs = true
    }
    size = ${OTAPULSE_ROOTFS_SIZE:-2G}
}

image rootfs_b.ext4 {
    ext4 {
        label = "rootfs_b"
        use-mke2fs = true
    }
    size = ${OTAPULSE_ROOTFS_SIZE:-2G}
    empty = true
}

image data.ext4 {
    ext4 {
        label = "data"
        use-mke2fs = true
    }
    size = ${OTAPULSE_DATA_SIZE:-512M}
    empty = true
}

image sdcard-rpi-ab.img {
    hdimage {
        gpt = true
    }

    partition boot {
        partition-type-uuid = C12A7328-F81F-11D2-BA4B-00A0C93EC93B
        image = boot.vfat
        bootable = true
    }

    partition rootfs_a {
        partition-type-uuid = 0FC63DAF-8483-4772-8E79-3D69D8477DE4
        image = rootfs.ext4
    }

    partition rootfs_b {
        partition-type-uuid = 0FC63DAF-8483-4772-8E79-3D69D8477DE4
        image = rootfs_b.ext4
    }

    partition data {
        partition-type-uuid = 0FC63DAF-8483-4772-8E79-3D69D8477DE4
        image = data.ext4
    }
}
