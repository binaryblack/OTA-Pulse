# OTA-Pulse A/B Partition Layout for Rockchip Platforms
#
# This genimage configuration is optimized for Rockchip RK3588/RK3568/RK3399.
# Includes proper bootloader offsets for Rockchip boot ROM requirements.
#
# Partition layout:
#   - Bootloader (idbloader.img at 32KB, u-boot.itb at 8MB)
#   - Boot partition (FAT32, kernel + DTB + extlinux)
#   - Root A partition (ext4, primary rootfs)
#   - Root B partition (ext4, OTA update target)
#   - Data partition (ext4, persistent storage)
#

image boot.vfat {
    vfat {
        files = {
            "Image",
            "rk*.dtb",
            "extlinux/extlinux.conf"
        }
    }
    size = 128M
}

image rootfs.ext4 {
    ext4 {
        label = "rootfs_a"
        use-mke2fs = true
    }
    size = ${OTAPULSE_ROOTFS_SIZE:-2G}
}

image rootfs_b.ext4 {
    ext4 {
        label = "rootfs_b"
        use-mke2fs = true
    }
    size = ${OTAPULSE_ROOTFS_SIZE:-2G}
    empty = true
}

image data.ext4 {
    ext4 {
        label = "data"
        use-mke2fs = true
    }
    size = ${OTAPULSE_DATA_SIZE:-512M}
    empty = true
}

image sdcard-rockchip-ab.img {
    hdimage {
        gpt = true
    }

    # idbloader at 32KB offset (Rockchip requirement)
    partition idbloader {
        in-partition-table = false
        image = "idbloader.img"
        offset = 32K
    }

    # u-boot.itb at 8MB offset
    partition uboot {
        in-partition-table = false
        image = "u-boot.itb"
        offset = 8M
    }

    partition boot {
        partition-type-uuid = C12A7328-F81F-11D2-BA4B-00A0C93EC93B
        image = boot.vfat
        bootable = true
        offset = 16M
    }

    partition rootfs_a {
        partition-type-uuid = 0FC63DAF-8483-4772-8E79-3D69D8477DE4
        image = rootfs.ext4
    }

    partition rootfs_b {
        partition-type-uuid = 0FC63DAF-8483-4772-8E79-3D69D8477DE4
        image = rootfs_b.ext4
    }

    partition data {
        partition-type-uuid = 0FC63DAF-8483-4772-8E79-3D69D8477DE4
        image = data.ext4
    }
}
