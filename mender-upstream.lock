# mender-upstream.lock -- pinned, vendored upstream Mender board-integration layers (TASK-S109-003)
#
# Format: one record per line, TAB separated, no quoting. Lines starting with '#' are comments.
#   component  url  ref  commit  subpath  vendored-dir  tree-sha256  patched-tree-sha256  patches-sha256  license-sha256
#   component     upstream layer name
#   url           upstream git repository (https)
#   ref           "tag:<tag>" or "branch:<branch>" the commit was taken from. The COMMIT is the pin;
#                 the ref is informational (meta-mender-community has no scarthgap tags: SHA only)
#   commit        full 40-hex upstream commit SHA
#   subpath       directory inside the upstream repo that was vendored ("." = whole repo)
#   vendored-dir  destination, relative to ota-pulse/
#   tree-sha256   tree hash of the PRISTINE upstream <subpath> at <commit>, algorithm below. Reproducible
#                 from a fresh clone ("mender-sync.sh --verify --online" does exactly that)
#   -- columns 8-10 were added by TASK-S109-004; a legacy 7-column row is still accepted (the tree-hash
#   -- check applies, the other checks warn until "mender-sync.sh --upgrade-lock" fills them in) --
#   patched-tree-sha256  tree hash of vendored-dir as it is ON DISK after the checked-in patch series
#                 ota-pulse/patches/mender/<component>/*.patch (NNNN-name.patch, sorted) was applied to the
#                 pristine tree. "-" when the component has no patches (disk tree == pristine tree).
#                 "mender-sync.sh --verify" checks the disk tree against this column when set, else tree-sha256.
#   patches-sha256  sha256 over one "<sha256-of-patch>  <name>\n" line per patch in sorted order; "-" when none.
#                 Catches a patch added/edited/removed without re-running "--sync".
#   license-sha256  sha256 of the LICENSE file we ADDED to vendored-dir (copy of the upstream repo-root LICENSE
#                 at <commit>; named on the "added-file:" line of UPSTREAM). "-" when the upstream subpath ships
#                 its own LICENSE. Lets "--verify" check the copy offline; "--verify --online" cmp's it with the
#                 real repo-root LICENSE.
#   Per-component manifests (mender-upstream.manifests/<component>.manifest = the "--list" output whose
#   sha256 equals the tree hash) let "--verify" name the exact files that differ.
#
# Tree-hash algorithm v1 (implemented by scripts/mender_tree_hash.py -- the reference implementation):
#   1. Walk vendored-dir. Skip every directory named ".git", the top-level file "UPSTREAM", and every path
#      named on an "added-file:" line of that UPSTREAM (files we added that do not exist upstream,
#      e.g. a copied repo-root LICENSE). Nothing else is skipped.
#   2. Sort entries by their "/"-separated relative path as UTF-8 bytes. Directories are not listed.
#   3. One line per entry, "\n" terminated:
#        regular file: "F <mode> <sha256(content)> <relpath>"   mode = 755 if owner-exec bit set, else 644
#        symlink:      "L 120000 <sha256(link target string)> <relpath>"
#   4. tree-sha256 = lowercase hex sha256 of all those lines concatenated.
#   The same algorithm run on the upstream <subpath> at <commit> gives the same value (added files excluded).
#
# Rules: never vendor meta-mender-commercial. Never edit vendored files (use patches/mender/, TASK-S109-004).
# Re-pin only via scripts/mender-sync.sh --sync (TASK-S109-004), never by hand.
