name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: soc-ota-agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # go.mod's `go 1.21` directive is the minimum language version
          # (matches README's documented build requirement); CI builds with a
          # newer toolchain so govulncheck isn't permanently red on stdlib CVEs
          # fixed in later Go releases (GAP-XC-002/XC-001).
          go-version: '1.25'
          cache-dependency-path: soc-ota-agent/go.sum

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config liblzma-dev libssl-dev libglib2.0-dev

      - name: go vet
        run: go vet -composites=false -unsafeptr=false ./...

      - name: gofmt check
        run: |
          fmt_out="$(gofmt -l $(find . -type f -name '*.go' -not -path './vendor/*'))"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt'ed:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go test
        run: go test -v ./...

  vulncheck:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: soc-ota-agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # go.mod's `go 1.21` directive is the minimum language version
          # (matches README's documented build requirement); CI builds with a
          # newer toolchain so govulncheck isn't permanently red on stdlib CVEs
          # fixed in later Go releases (GAP-XC-002/XC-001).
          go-version: '1.25'
          cache-dependency-path: soc-ota-agent/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck
        run: govulncheck ./...

  target-shebang-lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Reject #!/bin/bash in Buildroot target-device scripts
        run: |
          # buildroot-otapulse/package/**/*.sh (and Sxx init scripts) are
          # installed straight onto the BusyBox-only target rootfs via
          # $(TARGET_DIR) in otapulse.mk — there is no /bin/bash there, only
          # /bin/sh (BusyBox ash). board/otapulse/*.sh runs on the build HOST
          # and is exempt. See BUG-417.
          bad=""
          for f in $(find buildroot-otapulse/package -type f \( -name '*.sh' -o -name 'S[0-9]*' \)); do
            head -n1 "$f" | grep -qE '^#!.*\bbash\b' && bad="$bad $f"
          done
          if [ -n "$bad" ]; then
            echo "Target-device scripts must use #!/bin/sh (BusyBox ash), not bash:"
            for f in $bad; do echo "  $f"; done
            exit 1
          fi
