name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: soc-ota-agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # go.mod's `go 1.21` directive is the minimum language version
          # (matches README's documented build requirement); CI builds with a
          # newer toolchain so govulncheck isn't permanently red on stdlib CVEs
          # fixed in later Go releases (GAP-XC-002/XC-001).
          go-version: '1.25'
          cache-dependency-path: soc-ota-agent/go.sum

      # xdelta3: installer/delta_rootfs_test.go execs the REAL xdelta3 binary and
      # t.Skip()s every delta-apply test without it (GC-CI-03).
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config liblzma-dev libssl-dev libglib2.0-dev xdelta3

      - name: go vet
        run: go vet -composites=false -unsafeptr=false ./...

      - name: gofmt check
        run: |
          fmt_out="$(gofmt -l $(find . -type f -name '*.go' -not -path './vendor/*'))"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt'ed:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go test
        run: go test -v ./...

      # GC-CI-03: a missing xdelta3 makes the rootfs-image-delta apply tests
      # skip (they pass vacuously otherwise). Fail loudly if any skip.
      - name: delta_rootfs tests must run (no skips)
        run: |
          set -o pipefail
          go test -count=1 -v -run 'TestDeltaRootfs_' ./installer/ | tee "$RUNNER_TEMP/delta-tests.log"
          if grep -q -- '--- SKIP' "$RUNNER_TEMP/delta-tests.log"; then
            echo "::error::delta_rootfs tests were skipped (xdelta3 missing?)"
            exit 1
          fi
          grep -q -- '--- PASS: TestDeltaRootfs_' "$RUNNER_TEMP/delta-tests.log"

      # GC-AG-08: informational data-race detection (does not gate the build).
      # Plain `go test -race` cannot even start in any package that imports
      # dbus: upstream's dbus/dbus_libgio.go (NewDBusAPI, run from dbus.init)
      # fakes C pointers with unsafe arithmetic, which -race's default
      # checkptr instrumentation aborts on ("fatal error: checkptr: pointer
      # arithmetic computed bad pointer value"). `-gcflags=all=-d=checkptr=0`
      # turns only that check off. Packages listed are the ones verified to
      # run clean this way. Still excluded (they report further races, mostly
      # in shared test harnesses such as client/test/server*.go, plus
      # app/auth.go and app/state.go): ./app/ and ./app/proxy/. Add them back
      # once those are fixed.
      - name: go test -race (informational)
        continue-on-error: true
        run: |
          go test -race -gcflags=all=-d=checkptr=0 -count=1 \
            ./app/updatecontrolmap/ ./cli/ ./client/ ./conf/ \
            ./datastore/ ./dbus/ ./device/ ./installer/ ./inventory/ \
            ./statescript/ ./store/ ./system/ ./tunnel/ ./utils/

  go-compat:
    # Jetson (meta-tegra / poky-kirkstone) builds the agent with Go 1.17.13.
    # go.mod says `go 1.21` but Go 1.17 does not enforce it, so a newer stdlib
    # API (e.g. os/exec.Cmd.WaitDelay, 1.20) only breaks the Jetson image
    # build. Build + vet (incl. tests) with the REAL oldest Go. See
    # soc-ota-agent/scripts/go-compat-check.sh.
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: soc-ota-agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.17.13'
          cache: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config liblzma-dev libssl-dev libglib2.0-dev

      - name: go-compat (oldest supported Go)
        env:
          GO_COMPAT_REQUIRE_OLD: '1'
        run: GO_COMPAT_GO="$(command -v go)" make go-compat

  vulncheck:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: soc-ota-agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # go.mod's `go 1.21` directive is the minimum language version
          # (matches README's documented build requirement); CI builds with a
          # newer toolchain so govulncheck isn't permanently red on stdlib CVEs
          # fixed in later Go releases (GAP-XC-002/XC-001).
          go-version: '1.25'
          cache-dependency-path: soc-ota-agent/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck
        run: govulncheck ./...

  vulncheck-shipped-go:
    # GC-CI-03: report-only. Device images ship soc-ota-agent built with Go
    # 1.22.12 (Yocto go-binary-native; Jetson uses 1.17.13), so the stdlib
    # advisories that the Go 1.25 `vulncheck` job above never sees are the ones
    # that reach the fleet. This job only makes that exposure visible: it can
    # never fail the workflow. Fixing it needs a toolchain bump + fleet rebuild
    # (human item H-08), not a CI change.
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: soc-ota-agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.12'
          cache-dependency-path: soc-ota-agent/go.sum

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config liblzma-dev libssl-dev libglib2.0-dev

      # govulncheck@latest needs a newer Go than 1.22.12 to BUILD; the default
      # GOTOOLCHAIN=auto fetches one just for this install, and the install step
      # leaves `go` itself on 1.22.12.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck (Go 1.22.12, report-only)
        continue-on-error: true
        env:
          # Pin the analysed toolchain: never let go.mod/GOTOOLCHAIN=auto swap
          # in a newer Go, which would hide the shipped stdlib exposure.
          GOTOOLCHAIN: local
        run: |
          go version
          rc=0
          govulncheck ./... > "$RUNNER_TEMP/govulncheck-1.22.12.txt" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/govulncheck-1.22.12.txt"
          {
            echo '### govulncheck on Go 1.22.12 (shipped toolchain, report-only)'
            echo '```'
            tail -n 25 "$RUNNER_TEMP/govulncheck-1.22.12.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

  python-tests:
    # GC-CI-03: boot-path structural tests (S55 bootcount-net splice, boot
    # deadline, firstboot scripts), the modules-artifact-gen tests, and the
    # u-boot-env host test. None of these ran in CI before.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.10 = the version modules-artifact-gen/tests/requirements.txt was
          # compiled with, and the last stock Python whose stdlib still ships
          # distutils (its conftest.py imports distutils.spawn).
          python-version: '3.10'

      - name: Install pytest
        run: python -m pip install -r soc-ota-agent/support/modules-artifact-gen/tests/requirements.txt

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      # modules-artifact-gen's conftest aborts without otapulse-artifact or
      # mender-artifact on PATH; the tests read generated artifacts back with
      # it. Built from source (same upstream release the repo pins, 3.11.2)
      # against the runner's OpenSSL 3: the prebuilt downloads.mender.io 3.11.2
      # binary links libssl.so.1.1, which ubuntu-22.04 does not ship. Mirrors
      # scripts/install-mender-artifact.sh's preferred Tier 2 in the parent repo.
      - name: Install mender-artifact
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
          GOBIN="$RUNNER_TEMP/bin" CGO_ENABLED=1 go install github.com/mendersoftware/mender-artifact@3.11.2
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/mender-artifact" --version

      - name: pytest (meta-otapulse + modules-artifact-gen)
        run: python -m pytest -q meta-otapulse soc-ota-agent/support/modules-artifact-gen/tests

      - name: u-boot-env setup script host test
        run: sh meta-otapulse/recipes-bsp/u-boot-env-config/tests/test-setup-uboot-env.sh

  target-shebang-lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Reject #!/bin/bash in Buildroot target-device scripts
        run: |
          # buildroot-otapulse/package/**/*.sh (and Sxx init scripts) are
          # installed straight onto the BusyBox-only target rootfs via
          # $(TARGET_DIR) in otapulse.mk — there is no /bin/bash there, only
          # /bin/sh (BusyBox ash). board/otapulse/*.sh runs on the build HOST
          # and is exempt. See BUG-417.
          bad=""
          for f in $(find buildroot-otapulse/package -type f \( -name '*.sh' -o -name 'S[0-9]*' \)); do
            head -n1 "$f" | grep -qE '^#!.*\bbash\b' && bad="$bad $f"
          done
          if [ -n "$bad" ]; then
            echo "Target-device scripts must use #!/bin/sh (BusyBox ash), not bash:"
            for f in $bad; do echo "  $f"; done
            exit 1
          fi
