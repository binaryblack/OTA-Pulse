name: Build Agent

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            cc: gcc
          - goos: linux
            goarch: arm64
            cc: aarch64-linux-gnu-gcc
          - goos: linux
            goarch: arm
            goarm: "7"
            cc: arm-linux-gnueabihf-gcc

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: soc-ota-agent/go.sum

      - name: Install cross-compilers and libraries
        run: |
          sudo dpkg --add-architecture arm64
          sudo dpkg --add-architecture armhf
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabihf \
            liblmdb-dev libssl-dev \
            liblmdb-dev:arm64 libssl-dev:arm64 \
            liblmdb-dev:armhf libssl-dev:armhf \
            || true  # Some multiarch packages may not be available on all runners

      - name: Build
        working-directory: soc-ota-agent
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CC: ${{ matrix.cc }}
          CGO_ENABLED: "1"
        run: make build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: otapulse-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm && format('-v{0}', matrix.goarm) || '' }}
          path: soc-ota-agent/otapulse
