name: secret-scan

# GC-CI-11 (TODO-153 / TASK-S108-062): gitleaks over the full git history.
#
# NON-BLOCKING for now (job-level continue-on-error): a local full-history run on 2026-10-11
# (gitleaks v8.30.0, redacted) reported pre-existing findings in this repo (test fixtures, docs and
# tracker examples, a few of them real-looking), none yet triaged into a baseline. Once triaged,
# commit a baseline (`gitleaks git --baseline-path`) or a .gitleaks.toml allowlist and delete the
# continue-on-error line to make it a gate. The findings are redacted in the log and in the
# uploaded report.
#
# The gitleaks binary is run from its official image, pinned by digest (v8.30.0), so no
# gitleaks-action org license is needed and the scanner cannot change under us.

on:
  push:
    branches: [main, master, develop]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks (full history, redacted)
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          docker run --rm \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            -v "$GITHUB_WORKSPACE:/repo:ro" -v "$RUNNER_TEMP/gitleaks:/out" \
            ghcr.io/gitleaks/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9 \
            git /repo --redact --no-banner --exit-code 1 \
            --report-format json --report-path /out/gitleaks.json

      - name: Upload gitleaks report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: ${{ runner.temp }}/gitleaks/gitleaks.json
          if-no-files-found: ignore
