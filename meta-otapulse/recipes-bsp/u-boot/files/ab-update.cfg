# U-Boot Configuration for A/B Partition Updates
# Enables reliable OTA updates with automatic rollback

# Enable environment saving
CONFIG_ENV_IS_IN_MMC=y
CONFIG_SYS_REDUNDAND_ENVIRONMENT=y
CONFIG_ENV_SIZE=0x4000
CONFIG_ENV_OFFSET=0x100000
CONFIG_ENV_OFFSET_REDUND=0x104000

# Boot retry and watchdog
CONFIG_BOOTRETRY=y
CONFIG_BOOT_RETRY_TIME=30
CONFIG_RESET_TO_RETRY=y

# Enable FIT image support for secure boot
CONFIG_FIT=y
CONFIG_FIT_SIGNATURE=y
CONFIG_FIT_VERBOSE=y
CONFIG_FIT_BEST_MATCH=y

# RSA signature verification
CONFIG_RSA=y
CONFIG_RSA_VERIFY=y

# SHA checksums
CONFIG_SHA256=y
CONFIG_SHA384=y

# Command line support
CONFIG_CMD_BOOTCOUNT=y
CONFIG_CMD_ENV=y
CONFIG_CMD_GPT=y
CONFIG_CMD_PART=y
CONFIG_CMD_MMC=y

# Boot count tracking
CONFIG_BOOTCOUNT_LIMIT=y
CONFIG_BOOTCOUNT_ENV=y
CONFIG_SYS_BOOTCOUNT_ADDR=0

# Watchdog
CONFIG_WATCHDOG=y
CONFIG_WDT=y
CONFIG_WATCHDOG_TIMEOUT_MSECS=30000
