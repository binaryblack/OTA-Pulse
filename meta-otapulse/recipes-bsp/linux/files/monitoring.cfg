# Kernel configuration for SoC Monitoring crash capture and telemetry

# Core dump support
CONFIG_COREDUMP=y
CONFIG_ELF_CORE=y
CONFIG_CORE_DUMP_DEFAULT_ELF_HEADERS=y

# Kernel symbol support for crash analysis
CONFIG_KALLSYMS=y
CONFIG_KALLSYMS_ALL=y
CONFIG_KALLSYMS_ABSOLUTE_PERCPU=y

# Debug info for symbolic crash dumps
CONFIG_DEBUG_INFO=y
CONFIG_DEBUG_INFO_DWARF4=y
CONFIG_DEBUG_INFO_REDUCED=n

# Stack traces
CONFIG_STACKTRACE=y
CONFIG_FRAME_POINTER=y

# Panic and crash handling
CONFIG_PANIC_ON_OOPS=y
CONFIG_PANIC_TIMEOUT=10

# Procfs support for metrics collection
CONFIG_PROC_FS=y
CONFIG_PROC_SYSCTL=y
CONFIG_PROC_PAGE_MONITOR=y

# Sysfs support for hardware monitoring
CONFIG_SYSFS=y
CONFIG_HWMON=y
CONFIG_THERMAL=y
CONFIG_THERMAL_HWMON=y

# Memory management debugging
CONFIG_PAGE_EXTENSION=y
CONFIG_DEBUG_PAGEALLOC=n
CONFIG_SLUB_DEBUG=y

# Network statistics
CONFIG_NETFILTER_NETLINK_LOG=y
CONFIG_NET_DROP_MONITOR=y

# Real-time clock for timestamps
CONFIG_RTC_CLASS=y
CONFIG_RTC_HCTOSYS=y

# Device tree support (for reboot reason)
CONFIG_OF=y
CONFIG_OF_KOBJ=y

# Logging
CONFIG_PRINTK=y
CONFIG_PRINTK_TIME=y
CONFIG_CONSOLE_LOGLEVEL_DEFAULT=7
CONFIG_MESSAGE_LOGLEVEL_DEFAULT=4
