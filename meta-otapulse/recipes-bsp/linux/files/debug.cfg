# Kernel debugging configuration for crash analysis
# Note: Some options increase memory/CPU overhead - disable for production

# Basic debug support
CONFIG_DEBUG_KERNEL=y
CONFIG_DEBUG_MISC=y

# Lock debugging (useful for deadlock analysis)
CONFIG_DEBUG_SPINLOCK=n
CONFIG_DEBUG_MUTEXES=n
CONFIG_DEBUG_LOCK_ALLOC=n
CONFIG_LOCKDEP=n

# Memory debugging
CONFIG_DEBUG_VM=n
CONFIG_DEBUG_SLAB=n
CONFIG_DEBUG_OBJECTS=n

# Kprobes for dynamic tracing
CONFIG_KPROBES=y
CONFIG_KPROBE_EVENTS=y

# Tracing support
CONFIG_FTRACE=y
CONFIG_FUNCTION_TRACER=y
CONFIG_SCHED_TRACER=y
CONFIG_STACK_TRACER=y
CONFIG_TRACER_SNAPSHOT=y

# Performance events
CONFIG_PERF_EVENTS=y
CONFIG_HW_PERF_EVENTS=y

# Kernel Address Sanitizer (disable in production)
CONFIG_KASAN=n

# Magic SysRq for emergency debugging
CONFIG_MAGIC_SYSRQ=y
CONFIG_MAGIC_SYSRQ_DEFAULT_ENABLE=0x1

# Kernel crash dump (kdump)
# Enable if you need full kernel crash dumps
# CONFIG_KEXEC=y
# CONFIG_CRASH_DUMP=y

# Bug and warning handling
CONFIG_BUG=y
CONFIG_GENERIC_BUG=y
CONFIG_DEBUG_BUGVERBOSE=y
