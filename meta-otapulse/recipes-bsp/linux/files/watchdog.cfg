# Kernel configuration for watchdog support

# Watchdog core support
CONFIG_WATCHDOG=y
CONFIG_WATCHDOG_CORE=y
CONFIG_WATCHDOG_NOWAYOUT=n
CONFIG_WATCHDOG_HANDLE_BOOT_ENABLED=y
CONFIG_WATCHDOG_OPEN_TIMEOUT=0
CONFIG_WATCHDOG_SYSFS=y

# Software watchdog (fallback)
CONFIG_SOFT_WATCHDOG=y

# Common hardware watchdogs
# Enable the appropriate one for your SoC
# CONFIG_IMX2_WDT=y          # i.MX
# CONFIG_SUNXI_WATCHDOG=y    # Allwinner
# CONFIG_DW_WATCHDOG=y       # DesignWare
# CONFIG_BCM2835_WDT=y       # Raspberry Pi
# CONFIG_TEGRA_WATCHDOG=y    # NVIDIA Tegra
# CONFIG_STM32_WATCHDOG=y    # STM32
# CONFIG_CADENCE_WATCHDOG=y  # Xilinx/Cadence

# Watchdog pretimeout support
CONFIG_WATCHDOG_PRETIMEOUT_GOV=y
CONFIG_WATCHDOG_PRETIMEOUT_DEFAULT_GOV_PANIC=y
