[Unit]
# Upstream dlt-system.service only declares Wants=dlt.service, no After= —
# that alone does not guarantee start ORDER, only that dlt.service gets
# pulled in. Found live: without this, dlt-system frequently starts before
# dlt.service has created the /tmp/dlt FIFO, hits "FIFO /tmp/dlt cannot be
# opened", and gets killed by its own WatchdogSec=2 before it can retry —
# a real race, not a config typo (sprint S43, TASK-S43-003).
After=dlt.service

[Service]
# Same WatchdogSec=2-too-tight issue as dlt.service's own drop-in — see
# dlt-ordering.conf. dlt-system additionally has to wait out dlt.service's
# own startup before its FIFO retry succeeds, so it needs at least as much
# headroom.
WatchdogSec=10
