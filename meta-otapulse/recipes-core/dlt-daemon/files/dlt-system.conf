# OTA-Pulse dlt-system configuration (sprint S43 / TODO-032).
#
# This replaces meta-oe's shipped /etc/dlt-system.conf. Enables the
# Systemd Journal Adapter so soc-ota-agent's (stdout -> journald only) and
# socmond's (dual-logs to /var/log/socmond/socmond.log AND journald)
# existing output is ingested into the DLT stream automatically — no code
# changes to either service. dlt-daemon's default PACKAGECONFIG already
# compiles this support in (systemd-journal + dlt-system, both on whenever
# DISTRO_FEATURES has systemd — confirmed in
# docs/dlt-daemon-recipe-spike.md); this file only flips the runtime
# JournalEnable flag, which ships OFF by default.
#
# Everything else keeps dlt-system's compiled-in default.

ApplicationId = SYS
JournalEnable = 1
JournalContextId = JOUR
JournalCurrentBoot = 1
JournalMapLogLevels = 1
JournalUseOriginalTimestamp = 1
