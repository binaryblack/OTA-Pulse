[Unit]
# dlt-daemon needs /data mounted before it can write OfflineTraceDirectory
# there (see dlt.conf), and must be running before soc-ota-agent/socmond
# start so their journald output is captured from their very first line —
# same ordering discipline as otapulse-boot-health.service (sprint S43).
After=otapulse-partition-setup.service
Before=soc-ota-agent.service socmond.service

[Service]
# /data/dlt (OfflineTraceDirectory in dlt.conf) is on a runtime-provisioned
# partition (see otapulse-partition-setup) — nothing creates the
# subdirectory itself. Found live: without this, dlt-daemon starts fine
# but silently never persists an offline trace. "-" prefix: non-fatal if
# /data isn't ready yet, matching this project's tolerant-startup
# discipline (core-handler.sh's own `|| true` pattern).
ExecStartPre=-/bin/mkdir -p /data/dlt

# BindAddress/OfflineTraceDirectory/etc. in /etc/dlt.conf do NOT control
# whether offline traces actually get written — that's gated by
# daemon->mode (EXTERNAL/INTERNAL/BOTH), which /etc/dlt.conf's own parser
# has NO key for. It's read-only from a SEPARATE runtime file,
# /tmp/dlt-runtime.cfg (tmpfs — absent on every fresh boot, confirmed live
# via "Cannot open configuration file: /tmp/dlt-runtime.cfg" in the daemon's
# own startup log), defaulting to DLT_USER_MODE_EXTERNAL (0=OFF, 1=EXTERNAL,
# 2=INTERNAL, 3=BOTH per include/dlt/dlt_types.h) — EXTERNAL only forwards
# to connected TCP clients and NEVER writes an offline trace at all. Found
# live: /data/dlt existed (previous fix) but stayed empty indefinitely.
# Write LoggingMode=3 (BOTH) fresh every boot, before dlt-daemon starts.
ExecStartPre=/bin/sh -c 'echo LoggingMode=3 > /tmp/dlt-runtime.cfg'

# Upstream ships WatchdogSec=2 — too tight under real boot load. Found
# live: dlt-daemon actively processing real log-level registrations
# (SYS:MGR/SYS:JOUR/SYS:DOG) got SIGABRT'd by its own watchdog before it
# looped back to ping systemd. A scalar [Service] directive in a drop-in
# overrides (not appends to) the base unit's value.
WatchdogSec=10
