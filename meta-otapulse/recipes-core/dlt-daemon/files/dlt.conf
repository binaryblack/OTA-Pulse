# OTA-Pulse dlt-daemon configuration (sprint S43 / TODO-032).
#
# This replaces meta-oe's shipped /etc/dlt.conf. Only the keys below are
# set; every other dlt-daemon setting keeps its compiled-in default (see
# docs/dlt-daemon-recipe-spike.md for the full default file and how these
# keys were confirmed against the real built package).

# Never expose the DLT TCP port on LAN — SSH-tunnel access only, matching
# this project's SSH-only remote-access posture (remote_ssh_* suites, frp
# tunnels; no service is ever raw-exposed). Sprint S43 decision #6.
BindAddress = 127.0.0.1

# BUG-474: BindAddress only constrains the TCP listener. dlt-daemon's
# compiled-in UDP multicast path (upstream's udp-connection PACKAGECONFIG,
# WITH_UDP_CONNECTION=ON by default) is a SEPARATE code path that ignores
# BindAddress entirely -- it binds 0.0.0.0:3490 and broadcasts every DLT
# message it holds, in plaintext, to 225.0.0.37:3491 on the whole LAN
# segment, with no credential and no opt-in. Proven live: an unprivileged
# host on the same LAN received real journald content (soc-ota-agent/
# kernel/dlt-daemon lines) from all 7 boards within seconds of joining that
# multicast group. This directly violates the SSH-tunnel-only posture
# above. Disabling it here is the runtime half of the fix; the bbappend
# below also drops the PACKAGECONFIG entirely so a future dlt.conf
# regression can't silently re-enable it (the capability won't even be
# compiled in).
UDPConnectionSetup = 0

# Persist to the board's already-provisioned /data partition so offline
# traces survive an OTA A/B slot switch (otapulse-partition-setup creates
# a real, physically separate /data on every board except
# qemux86-64-yocto — see the plan doc's per-board table, sprint S43
# decision #3). Sizes kept at dlt-daemon's own modest defaults since some
# boards' /data is as small as 101MB (Jetson UDA partition).
OfflineTraceDirectory = /data/dlt
OfflineTraceFileSize = 1000000
OfflineTraceMaxSize = 4000000
OfflineTraceFileNameTimestampBased = 1
