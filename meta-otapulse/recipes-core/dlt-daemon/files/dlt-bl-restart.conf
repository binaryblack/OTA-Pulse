# BUG-546: bootloader-compat (otapulse-bootloader) images only. Installed as
# a 51-* drop-in for both dlt.service and dlt-system.service.
#
# On the qemuarm64-bl TCG row a ~minute-long whole-guest stall (slow emulated
# SD, see docs/mender-compat/QUALIFICATION.md) makes the daemon miss even the
# 10 s watchdog ping (WatchdogSec=10 in 50-otapulse-ordering.conf); systemd
# SIGABRTs it and, the upstream unit having no Restart=, the unit stayed
# failed for the rest of the boot (degraded system state). A watchdog kill
# counts as a failure for Restart=on-failure, so the diagnostics daemons now
# come back on their own. Does not touch BindAddress/UDP settings
# (localhost-only 3490 is unchanged).
[Service]
Restart=on-failure
RestartSec=2
