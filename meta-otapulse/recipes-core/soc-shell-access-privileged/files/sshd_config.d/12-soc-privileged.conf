# /etc/ssh/sshd_config.d/12-soc-privileged.conf
# Managed by OTA — do not edit; replaced on every OTA update.
#
# PURPOSE
# -------
# Enforce pubkey-only authentication for the otapulse-elevated and
# otapulse-breakglass users, exactly like soc-shell-access's
# 10-soc-support.conf does for 'support' (see that file for the full
# S16-009 root-cause writeup — no-PAM sshd's allowed_user() rejects ALL
# auth methods, including publickey, for a locked shadow sentinel; this
# package's pkg_postinst gives both users a SHA-512crypt hash of a
# build-time random secret instead, then this drop-in ensures the unknown
# password can never be used over SSH regardless).
#
# Numbered 12- (after soc-shell-access's 08-/10-) so it loads after the
# AuthorizedKeysFile directive at 08-gateway-authkeys.conf, which is
# global-only and already covers these users via its %u lookup — no
# change to that file is needed.
#
# INCLUDE MECHANISM
# -----------------
# Loaded via "Include /etc/ssh/sshd_config.d/*.conf", which soc-shell-access
# (this package's RDEPENDS) injects idempotently at do_rootfs time if the
# base image's sshd_config doesn't already ship it (BUG-114).

Match User otapulse-elevated,otapulse-breakglass
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PubkeyAuthentication yes
    AuthenticationMethods publickey
