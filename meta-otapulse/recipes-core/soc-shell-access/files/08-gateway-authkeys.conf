# OTA-Pulse Remote SSH — gateway authorized_keys lookup path.
#
# Adds /etc/ssh/authorized_keys/%u as a second lookup path so that the gateway
# public key (installed by soc-shell-access into /etc/ssh/authorized_keys/support)
# is found even if ~/.ssh/authorized_keys does not exist or the home directory
# is on a volatile overlay layer.
#
# AuthorizedKeysFile is a global-only sshd directive (OpenSSH rejects it inside
# a Match block).  This file is prefixed 08- so it is processed before the
# 10-soc-support.conf Match block; the first AuthorizedKeysFile directive wins.
#
# Key rotation: update soc-shell-access/files/gateway-authorized-key and rebuild.
AuthorizedKeysFile .ssh/authorized_keys /etc/ssh/authorized_keys/%u
