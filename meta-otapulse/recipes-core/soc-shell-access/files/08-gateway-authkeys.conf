# /etc/ssh/sshd_config.d/08-gateway-authkeys.conf
# Managed by OTA — do not edit; replaced on every OTA update.
#
# PURPOSE
# -------
# Tell sshd to look for authorised keys in /etc/ssh/authorized_keys/%u
# (in addition to the user's own ~/.ssh/authorized_keys).  The
# soc-shell-access recipe installs the OTA-Pulse gateway public key at
# /etc/ssh/authorized_keys/support so the gateway can authenticate as
# the 'support' user.
#
# WITHOUT this drop-in, sshd only checks ~/.ssh/authorized_keys (the
# default AuthorizedKeysFile value), which is absent for 'support',
# resulting in WebSocket close 1011 "SSH connection failed" on every
# remote shell session open.
#
# INCLUDE MECHANISM
# -----------------
# This file is loaded via "Include /etc/ssh/sshd_config.d/*.conf" which
# must appear in the main /etc/ssh/sshd_config.  The openssh bbappend in
# meta-otapulse/recipes-connectivity/openssh/openssh_%.bbappend ensures
# this Include line is present for all OTA-Pulse images.  On older poky
# images where the Include is absent, the soc-shell-access do_install
# injects it directly.

AuthorizedKeysFile .ssh/authorized_keys /etc/ssh/authorized_keys/%u
