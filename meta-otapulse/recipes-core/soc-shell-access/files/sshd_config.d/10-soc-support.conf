# /etc/ssh/sshd_config.d/10-soc-support.conf
# Managed by OTA — do not edit; replaced on every OTA update.
#
# PURPOSE
# -------
# Enforce pubkey-only authentication for the `support` user so the
# OTA-Pulse gateway can log in via its SSH key and NOTHING ELSE.
#
# ROOT CAUSE FIXED (S16-009)
# --------------------------
# This firmware's OpenSSH is compiled WITHOUT PAM (/etc/pam.d/sshd does
# not exist → UsePAM no).  With no PAM, OpenSSH's own allowed_user()
# account-check function inspects the shadow password field directly and
# REJECTS login for ALL auth methods — including publickey — when the
# password field is a locked/disabled sentinel (!, !!, or *).
#
# S16-008 created support with --password ! (locked).  A live test on RPi4
# confirmed: "Permission denied (publickey,password)".  Unlocking the
# account immediately fixed it — proving the root cause.
#
# The recipe now gives support a SHA-512 hash of a build-time-generated
# random secret (see USERADD_PARAM / do_install in the .bb file).  That
# satisfies allowed_user()'s "not locked" check.  This drop-in then
# disables PasswordAuthentication and KbdInteractiveAuthentication so the
# unknown password can NEVER be used over SSH — only the gateway pubkey works.
#
# NET EFFECT
# ----------
#   passwd -S support   → NOT "L" (lock sentinel absent from shadow field)
#   SSH password login  → rejected by sshd (PasswordAuthentication no)
#   SSH pubkey login    → accepted (PubkeyAuthentication yes, gateway key)
#   AuthenticationMethods publickey → only this one path is allowed
#
# INCLUDE MECHANISM
# -----------------
# The OE-core/poky sshd_config ships:
#   Include /etc/ssh/sshd_config.d/*.conf
# at its top, so this file is automatically loaded.  No modification to
# the main sshd_config is required.

Match User support
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PubkeyAuthentication yes
    AuthenticationMethods publickey
