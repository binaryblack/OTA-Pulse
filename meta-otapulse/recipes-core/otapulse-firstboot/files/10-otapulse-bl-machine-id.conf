# Installed ONLY in bootloader compatibility mode (override "otapulse-bootloader"); a native image
# never ships this drop-in, so its otapulse-machine-id.service is byte-identical to before.
#
# TASK-S109-018 (found live on both QEMU bootloader-mode rows): the FIRST boot of an A/B slot that
# an OTA has just written starts with the EMPTY /etc/machine-id the image ships, and systemd answers
# an empty machine-id by bind-mounting a READ-ONLY transient file over it ("Installed transient
# /etc/machine-id file"). otapulse-machine-id's restore path then does
# `cp /data/etc/machine-id /etc/machine-id` into that read-only mount and fails ("Read-only file
# system"): the unit FAILS (`systemctl --failed`, the system is "degraded") and the device keeps the
# transient id for that boot, i.e. it shows up on the server under a NEW identity after every OTA.
# (The very first boot of a factory image is not affected: it takes the generate path, which goes
# through systemd-machine-id-setup, and that unmounts the transient file itself.)
#
# Drop the transient mount before the script runs so the restore writes the real file. The "-"
# prefix keeps the unit startable when there is nothing to unmount (a slot that already carries a
# committed machine-id, i.e. every later boot).
[Service]
ExecStartPre=-/bin/sh -c "grep -q ' /etc/machine-id ' /proc/self/mountinfo && umount /etc/machine-id"
