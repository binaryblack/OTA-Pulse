# Installed ONLY in bootloader compatibility mode with OTAPULSE_PROVISIONING_MODE =
# "manual" (override "otapulse-bootloader"); a native image never ships this
# drop-in, so its otapulse-auto-provision.service is byte-identical to before.
#
# "manual" provisioning: the image carries NO provisioning token (no
# /etc/otapulse/provision.env). The operator places the token on the persistent
# data partition instead, and this unit reads it from there:
#
#     install -d -m 0700 /data/otapulse
#     printf 'OTAPULSE_PROVISIONING_TOKEN=<token>\n' > /data/otapulse/provision.env
#     chmod 0600 /data/otapulse/provision.env
#
# /data survives updates, so the token (and the device identity it creates) stays
# with the device.
#
# RequiresMountsFor=/data: the file is only readable once the data partition is
# mounted; without it the optional EnvironmentFile below could be missed by a
# boot that wins the race. (The "-" prefix keeps the unit startable when the file
# is absent, exactly like the base unit's own /etc/otapulse/provision.env.)
# The later EnvironmentFile= wins, so this file takes precedence over /etc.
[Unit]
RequiresMountsFor=/data

[Service]
EnvironmentFile=-/data/otapulse/provision.env
