# Installed ONLY when OTAPULSE_BOOT_MODE=bootloader (override
# "otapulse-bootloader"); a native image never ships this drop-in, so its
# soc-ota-agent.service is byte-identical to before.
#
# Bootloader mode: the bootloader's own environment (U-Boot env / GRUB
# grubenv) is the boot-slot authority. /etc/fw_env.config is a symlink into
# /data/u-boot/ (the data partition), so the agent MUST NOT start until the
# /data mount has completed, otherwise fw_printenv cannot read the environment
# and the agent refuses to run the dual-rootfs device (fail-closed).
#
# otapulse-partition-setup.service: the Requires= on it is removed from the
# INSTALLED BASE UNIT by the recipe's bootloader branch of do_install, NOT here:
# a drop-in's empty "Requires=" does not reset the base unit's list on systemd
# 255, so it cannot be done from a drop-in. After= stays in the base unit: while
# the service is installed it seeds /data/otapulse (device_type) and the agent
# must start after it; After= on an absent or condition-skipped unit is harmless.
[Unit]
Requires=data.mount
RequiresMountsFor=/data
