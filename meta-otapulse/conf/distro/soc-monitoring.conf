# SoC Monitoring Distribution Configuration
# Extends poky/OE-core with device monitoring capabilities

DISTRO = "soc-monitoring"
DISTRO_NAME = "SoC Monitoring Distribution"
DISTRO_VERSION = "1.0.0"
DISTRO_CODENAME = "alpha"

# Maintainer information
MAINTAINER = "SoC Monitoring Team <support@example.com>"

# Base distribution features on poky
require conf/distro/poky.conf

# Distribution features
DISTRO_FEATURES:append = " systemd usrmerge"
DISTRO_FEATURES:remove = "sysvinit"

# Use systemd as init manager
INIT_MANAGER = "systemd"
VIRTUAL-RUNTIME_init_manager = "systemd"
VIRTUAL-RUNTIME_initscripts = "systemd-compat-units"
VIRTUAL-RUNTIME_login_manager = "shadow-base"
VIRTUAL-RUNTIME_dev_manager = "systemd"

# Enable systemd services
DISTRO_FEATURES_BACKFILL_CONSIDERED += "sysvinit"

# Package management - use IPK for smaller footprint
PACKAGE_CLASSES = "package_ipk"

# SDK configuration
SDK_VENDOR = "-socmonitoring"
SDK_VERSION = "${DISTRO_VERSION}"
SDK_NAME = "${DISTRO}-${TCLIBC}-${SDKMACHINE}-${IMAGE_BASENAME}-${TUNE_PKGARCH}-${MACHINE}"

# Firmware versioning support
DISTRO_VERSION_ID = "${DISTRO_VERSION}-${@time.strftime('%Y%m%d%H%M%S', time.gmtime())}"

# Enable debug info for crash analysis (can be overridden per-recipe)
DEBUG_BUILD ?= "0"
INHIBIT_PACKAGE_STRIP ?= "0"
PACKAGE_DEBUG_SPLIT_STYLE ?= "debug-with-srcpkg"

# Network configuration
CONNECTIVITY_CHECK_URIS ?= "https://www.google.com/"

# Security features
DISTRO_FEATURES:append = " seccomp"

# Enable kernel modules auto-loading
KERNEL_MODULE_AUTOLOAD += ""

# Default timezone
DEFAULT_TIMEZONE = "UTC"

# Image configuration defaults
IMAGE_FSTYPES ?= "wic.gz wic.bmap"

# Preferred providers for monitoring stack
PREFERRED_PROVIDER_virtual/monitoring-daemon = "socmond"
# Use shell script version to avoid Rust build complexity
PREFERRED_RPROVIDER_socmond = "socmond-bin"

# Version information embedded in builds
INHERIT += "buildhistory"
BUILDHISTORY_COMMIT = "1"

# License configuration
LICENSE_FLAGS_ACCEPTED += "commercial"

# =============================================================
# OTA Configuration (Custom A/B Partition Updates via socmond)
# =============================================================

# Storage configuration for A/B rootfs updates
OTA_STORAGE_DEVICE = "/dev/mmcblk0"
OTA_BOOT_PART = "${OTA_STORAGE_DEVICE}p1"
OTA_ROOTFS_PART_A = "${OTA_STORAGE_DEVICE}p2"
OTA_ROOTFS_PART_B = "${OTA_STORAGE_DEVICE}p3"
OTA_DATA_PART = "${OTA_STORAGE_DEVICE}p4"

# Partition sizes (legacy variables for runtime)
OTA_BOOT_PART_SIZE_MB = "100"
OTA_DATA_PART_SIZE_MB = "500"
OTA_STORAGE_TOTAL_SIZE_MB = "4096"

# =============================================================
# WIC Partition Size Configuration
# =============================================================
# These variables control partition sizes in the WKS files.
# Override in local.conf for custom partition layouts.
#
# For large images (Qt, multimedia >1GB), use:
#   WKS_FILE = "soc-monitoring-large.wks"
#   SOC_WKS_ROOTFS_SIZE = "6G"
#
# Storage calculation:
#   Total = boot + (2 × rootfs) + data + ~500M overhead
#   Default (small): 100M + 2×1G + 500M = ~2.7GB (4GB minimum recommended)
#   Large: 256M + 2×6G + 2G = ~14.3GB (16GB minimum recommended)

# Boot partition size (kernel, DTB, overlays)
SOC_WKS_BOOT_SIZE ?= "100M"

# Root filesystem partition size (A and B partitions will both use this size)
# Set larger for Qt/multimedia images
SOC_WKS_ROOTFS_SIZE ?= "1G"

# Persistent data partition size
SOC_WKS_DATA_SIZE ?= "500M"

# Disk device name used in WKS --ondisk directives.
# Default is eMMC/SD (mmcblk0) for real hardware.
# Override in local.conf for other targets:
#   QEMU virtio: SOC_WKS_DISK = "vda"
#   SATA/USB:    SOC_WKS_DISK = "sda"
#   NVMe:        SOC_WKS_DISK = "nvme0n1"  (also update WKS --ondisk syntax for nvme)
SOC_WKS_DISK ?= "mmcblk0"

# WIC file to use (default for small images, use -large for bigger)
WKS_FILE ?= "soc-monitoring.wks.in"

# Your OTA server (change this!)
OTA_SERVER_URL = "https://ota.your-company.com"

# Artifact name format
OTA_ARTIFACT_NAME = "${DISTRO_VERSION}-${MACHINE}-${@time.strftime('%Y%m%d', time.gmtime())}"

# =============================================================
# OTA Signature Verification Configuration
# =============================================================

# Enable signature verification on device (set in local.conf for production)
# When "1", device only accepts signed firmware updates
SOC_OTA_SIGNATURE_VERIFICATION ?= "0"

# Private key for signing artifacts during build
# Set this in local.conf to enable automatic artifact signing
SOC_OTA_SIGNING_KEY ?= ""

# Optional signing certificate
SOC_OTA_SIGNING_CERT ?= ""

# Custom public keys for verification (overrides default keys)
# Space-separated list of paths to public key files
SOC_OTA_VERIFICATION_KEYS ?= ""

# Directory on target device for signing keys
SOC_OTA_SIGNING_KEYS_DIR ?= "/etc/soc-monitoring/signing-keys"

# Mender artifact device type (defaults to MACHINE)
MENDER_DEVICE_TYPE ?= "${MACHINE}"

# Mender artifact compression
MENDER_ARTIFACT_COMPRESSION ?= "gzip"

