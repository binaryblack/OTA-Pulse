# Layer configuration for SoC Monitoring integration
# Provides device telemetry, crash capture, and OTA update support

# Layer naming and path configuration
BBPATH .= ":${LAYERDIR}"
BBFILES += ""

# Recipe locations
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bbappend"

# Layer name and priority
BBFILE_COLLECTIONS += "meta-soc-monitoring"
BBFILE_PATTERN_meta-soc-monitoring = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-soc-monitoring = "10"

# Layer version compatibility
LAYERVERSION_meta-soc-monitoring = "1"
LAYERDEPENDS_meta-soc-monitoring = "core"

# Compatible Yocto versions (Kirkstone LTS and later)
LAYERSERIES_COMPAT_meta-soc-monitoring = "kirkstone langdale mickledore nanbield scarthgap"

# License file location
LICENSE_PATH += "${LAYERDIR}/files/licenses"

# WKS templates for OTAPulse A/B partitioning
WKS_SEARCH_PATH:prepend := "${LAYERDIR}/wic:"
